[project]
name = "qiskit-circuit-utils"
version = "0.1.0"
description = "Reusable quantum circuit utilities for Qiskit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Aiden C Khanna" },
]
dependencies = [
    "qiskit>=2.0",
    "numpy>=2.0",
]

[project.urls]
Repository = "https://github.com/1Aiden-K/qiskit-circuit-utils"
Issues = "https://github.com/1Aiden-K/qiskit-circuit-utils/issues"
Changelog = "https://github.com/1Aiden-K/qiskit-circuit-utils/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
